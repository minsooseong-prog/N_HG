<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>헬스 기구 챗봇</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      margin: 0; padding: 16px; color: #1f2933; font-size: 15px; line-height: 1.5;
      background: #f0f2f5;
    }
    .container { max-width: 640px; margin: 0 auto; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .card {
      border: 1px solid #e4e7eb; border-radius: 10px; padding: 12px; margin-bottom: 12px;
      background: #fff;
    }
    button {
      background: #2f6fed; color: #fff; border: none; border-radius: 8px;
      padding: 9px 14px; font-size: 14px; cursor: pointer;
    }
    button:disabled { background: #a9b4c2; cursor: not-allowed; }
    button.secondary { background: #e4e7eb; color: #1f2933; }
    input[type=file] { font-size: 13px; }
    #preview { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }
    .label { font-weight: 600; color: #3e4c59; margin-top: 10px; }
    ul { margin: 4px 0 0; padding-left: 18px; }
    .muted { color: #7b8794; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; }
    .high { background: #def7ec; color: #03543f; }
    .medium { background: #fef3c7; color: #92400e; }
    .low { background: #fde8e8; color: #9b1c1c; }
    .chat-msg { padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; }
    .chat-user { background: #eef2ff; }
    .chat-bot { background: #f5f7fa; }
    .spinner { color: #7b8794; font-size: 13px; }
    textarea { width: 100%; box-sizing: border-box; border: 1px solid #cbd2d9;
      border-radius: 8px; padding: 8px; font-size: 14px; resize: vertical; }
  </style>
</head>
<body>
  <div class="container">
  <h2>🏋️ 헬스 기구 챗봇</h2>

  <div class="card">
    <div class="label">기구 사진</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <img id="preview">
    <div style="margin-top:10px;">
      <button id="analyzeBtn" disabled>분석하기</button>
    </div>
    <div id="analyzeStatus" class="spinner"></div>
  </div>

  <div id="result" class="card" style="display:none;"></div>

  <div id="chatCard" class="card" style="display:none;">
    <div class="label">이 기구에 대해 더 물어보기</div>
    <div id="chatLog" style="margin:8px 0;"></div>
    <textarea id="chatInput" rows="2" placeholder="예: 초보자는 몇 kg부터 시작하면 좋아요?"></textarea>
    <div style="margin-top:8px;">
      <button id="chatBtn">질문하기</button>
    </div>
  </div>

  </div>

  <script>
    let imageData = null;   // 순수 base64
    let imageMime = null;
    let equipmentInfo = null;
    let chatHistory = [];

    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const analyzeStatus = document.getElementById('analyzeStatus');
    const resultEl = document.getElementById('result');
    const chatCard = document.getElementById('chatCard');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const chatBtn = document.getElementById('chatBtn');

    fileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const dataUrl = ev.target.result;
        imageMime = dataUrl.substring(dataUrl.indexOf(':') + 1, dataUrl.indexOf(';'));
        imageData = dataUrl.split(',')[1]; // 접두어 제거한 순수 base64
        preview.src = dataUrl;
        preview.style.display = 'block';
        analyzeBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    });

    analyzeBtn.addEventListener('click', async function () {
      if (!imageData) return;
      analyzeBtn.disabled = true;
      analyzeStatus.textContent = '⏳ 기구를 분석하는 중...';
      resultEl.style.display = 'none';
      chatCard.style.display = 'none';

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageData, mimeType: imageMime })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '분석 요청 실패');

        equipmentInfo = data;
        chatHistory = [];
        renderResult(data);
        analyzeStatus.textContent = '';
      } catch (err) {
        analyzeStatus.textContent = '⚠️ 오류: ' + err.message;
      } finally {
        analyzeBtn.disabled = false;
      }
    });

    function renderResult(r) {
      const conf = (r.confidence || 'medium').toLowerCase();
      const li = function (arr) {
        return '<ul>' + (arr || []).map(function (x) {
          return '<li>' + escapeHtml(x) + '</li>';
        }).join('') + '</ul>';
      };

      let html = '';
      html += '<div style="font-size:16px;font-weight:700;">' +
        escapeHtml(r.equipmentNameKo || '알 수 없음') +
        ' <span class="muted">' + escapeHtml(r.equipmentNameEn || '') + '</span></div>';
      html += '<div style="margin-top:4px;"><span class="badge ' + conf + '">확신도 ' + conf + '</span></div>';
      html += '<div class="label">설명</div><div>' + escapeHtml(r.description || '') + '</div>';
      html += '<div class="label">사용 방법</div>' + li(r.usage);
      html += '<div class="label">타깃 부위</div>' + li(r.targetMuscles);
      html += '<div class="label">주의할 점</div>' + li(r.cautions);

      if (r.relatedExercises && r.relatedExercises.length) {
        html += '<div class="label">관련 운동 (데이터셋)</div><ul>';
        r.relatedExercises.forEach(function (ex) {
          html += '<li>' + escapeHtml(ex.name) +
            (ex.target ? ' <span class="muted">· ' + escapeHtml(ex.target) + '</span>' : '') + '</li>';
        });
        html += '</ul>';
      }
      html += '<div class="muted" style="margin-top:10px;">※ 정확한 자세는 전문 트레이너에게 확인하세요.</div>';

      resultEl.innerHTML = html;
      resultEl.style.display = 'block';
      chatCard.style.display = 'block';
      chatLog.innerHTML = '';
    }

    chatBtn.addEventListener('click', async function () {
      const q = chatInput.value.trim();
      if (!q || !equipmentInfo) return;
      appendChat('user', q);
      chatInput.value = '';
      chatBtn.disabled = true;

      const thinking = document.createElement('div');
      thinking.className = 'chat-msg chat-bot spinner';
      thinking.textContent = '답변 작성 중...';
      chatLog.appendChild(thinking);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, equipmentInfo: equipmentInfo, history: chatHistory })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '답변 요청 실패');

        chatLog.removeChild(thinking);
        appendChat('model', data.answer);
        chatHistory.push({ role: 'user', text: q });
        chatHistory.push({ role: 'model', text: data.answer });
      } catch (err) {
        chatLog.removeChild(thinking);
        appendChat('model', '⚠️ 오류: ' + err.message);
      } finally {
        chatBtn.disabled = false;
      }
    });

    function appendChat(role, text) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + (role === 'user' ? 'chat-user' : 'chat-bot');
      div.innerHTML = (role === 'user' ? '🙋 ' : '🤖 ') + escapeHtml(text).replace(/\n/g, '<br>');
      chatLog.appendChild(div);
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
